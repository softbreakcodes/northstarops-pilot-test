name: Claim Issue

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: claim-${{ github.repository }}
  cancel-in-progress: false

jobs:
  claim:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      github.event.comment.body == '/claim'
    runs-on: ubuntu-latest

    steps:
      - name: Process claim
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.NORTHSTAROPS_PROJECT_TOKEN }}
          PROJECT_TITLE: NorthstarOps Pilot Test
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
        shell: bash
        run: |
          set -euo pipefail

          issue_json="$(gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}")"

          if ! jq -e '.labels | any(.name == "status: available")' <<<"${issue_json}" >/dev/null; then
            gh api \
              -X POST \
              "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body="@${ACTOR} bu Issue şu anda claim edilebilir değil. Yalnızca \`status: available\` etiketli Issue'lar claim edilebilir."
            exit 0
          fi

          current_assignee="$(jq -r '.assignees[0].login // empty' <<<"${issue_json}")"
          if [[ -n "${current_assignee}" ]]; then
            gh api \
              -X POST \
              "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body="@${ACTOR} bu Issue zaten @${current_assignee} tarafından claim edilmiş. Lütfen başka bir \`status: available\` Issue seç."
            exit 0
          fi

          active_claims="$(gh api \
            -X GET \
            search/issues \
            -f q="repo:${REPOSITORY} is:issue is:open label:\"status: claimed\" assignee:${ACTOR}" \
            --jq '.total_count')"

          if [[ "${active_claims}" -gt 0 ]]; then
            gh api \
              -X POST \
              "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body="@${ACTOR} zaten aktif bir claim'in var. Yeni bir Issue claim etmeden önce mevcut çalışmanı tamamla veya claim'i bırak."
            exit 0
          fi

          if ! gh api \
            -X GET \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/assignees/${ACTOR}" \
            >/dev/null 2>&1; then
            gh api \
              -X POST \
              "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body="@${ACTOR} GitHub bu hesap için otomatik assignment'a izin vermedi. Bir maintainer'ın kontrol etmesi gerekiyor."
            exit 0
          fi

          if [[ -z "${PROJECT_TOKEN}" ]]; then
            gh api \
              -X POST \
              "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body="@${ACTOR} claim geçici olarak kullanılamıyor: repository yöneticisi \`NORTHSTAROPS_PROJECT_TOKEN\` secret'ını yapılandırmalıdır."
            exit 1
          fi

          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY##*/}"

          project_json="$(GH_TOKEN="${PROJECT_TOKEN}" gh api graphql \
            -f query='query($org:String!) { organization(login:$org) { projectsV2(first:100) { nodes { id title fields(first:100) { nodes { ... on ProjectV2SingleSelectField { id name options { id name } } } } } } } }' \
            -F org="${owner}")"

          project_id="$(jq -r --arg title "${PROJECT_TITLE}" '.data.organization.projectsV2.nodes[] | select(.title == $title) | .id' <<<"${project_json}" | head -n1)"
          status_field_id="$(jq -r --arg title "${PROJECT_TITLE}" '.data.organization.projectsV2.nodes[] | select(.title == $title) | .fields.nodes[] | select(.name == "Status") | .id' <<<"${project_json}" | head -n1)"
          claimed_option_id="$(jq -r --arg title "${PROJECT_TITLE}" '.data.organization.projectsV2.nodes[] | select(.title == $title) | .fields.nodes[] | select(.name == "Status") | .options[]? | select(.name == "Claimed") | .id' <<<"${project_json}" | head -n1)"

          if [[ -z "${project_id}" || -z "${status_field_id}" || -z "${claimed_option_id}" ]]; then
            gh api \
              -X POST \
              "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body="@${ACTOR} claim tamamlanamadı: \`${PROJECT_TITLE}\` projesinde \`Status → Claimed\` yapılandırması bulunamadı."
            exit 1
          fi

          issue_node_id="$(GH_TOKEN="${PROJECT_TOKEN}" gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!) { repository(owner:$owner,name:$repo) { issue(number:$number) { id projectItems(first:100) { nodes { id project { id } } } } } }' \
            -F owner="${owner}" \
            -F repo="${repo}" \
            -F number="${ISSUE_NUMBER}" \
            --jq '.data.repository.issue.id')"

          item_id="$(GH_TOKEN="${PROJECT_TOKEN}" gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!) { repository(owner:$owner,name:$repo) { issue(number:$number) { projectItems(first:100) { nodes { id project { id } } } } } }' \
            -F owner="${owner}" \
            -F repo="${repo}" \
            -F number="${ISSUE_NUMBER}" \
            --jq --arg project_id "${project_id}" '.data.repository.issue.projectItems.nodes[] | select(.project.id == $project_id) | .id' | head -n1)"

          if [[ -z "${item_id}" ]]; then
            item_id="$(GH_TOKEN="${PROJECT_TOKEN}" gh api graphql \
              -f query='mutation($project:ID!,$content:ID!) { addProjectV2ItemById(input:{projectId:$project,contentId:$content}) { item { id } } }' \
              -F project="${project_id}" \
              -F content="${issue_node_id}" \
              --jq '.data.addProjectV2ItemById.item.id')"
          fi

          gh api \
            -X POST \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" \
            -f "assignees[]=${ACTOR}" \
            >/dev/null

          gh api \
            -X POST \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/labels" \
            -f "labels[]=status: claimed" \
            >/dev/null

          encoded_available="$(printf '%s' 'status: available' | jq -sRr @uri)"
          gh api \
            -X DELETE \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/labels/${encoded_available}" \
            >/dev/null

          if ! GH_TOKEN="${PROJECT_TOKEN}" gh api graphql \
            -f query='mutation($project:ID!,$item:ID!,$field:ID!,$option:String!) { updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{singleSelectOptionId:$option}}) { projectV2Item { id } } }' \
            -F project="${project_id}" \
            -F item="${item_id}" \
            -F field="${status_field_id}" \
            -F option="${claimed_option_id}" \
            >/dev/null; then
            gh api \
              -X POST \
              "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/labels" \
              -f "labels[]=status: available" \
              >/dev/null

            encoded_claimed="$(printf '%s' 'status: claimed' | jq -sRr @uri)"
            gh api \
              -X DELETE \
              "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/labels/${encoded_claimed}" \
              >/dev/null || true

            gh api \
              -X DELETE \
              "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" \
              -f "assignees[]=${ACTOR}" \
              >/dev/null || true

            gh api \
              -X POST \
              "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              -f body="@${ACTOR} claim geri alındı: Project Status \`Claimed\` olarak güncellenemedi."
            exit 1
          fi

          gh api \
            -X POST \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$(printf '%s\n%s' '<!-- northstarops-claim -->' "✅ @${ACTOR} bu Issue'yu claim etti. 24 saat içinde bağlı bir Draft PR açmalısın.")"
