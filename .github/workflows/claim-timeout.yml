name: Claim Timeout

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      timeout_hours:
        description: "Manual test timeout in hours"
        required: false
        default: "24"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: claim-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-timeouts:
    runs-on: ubuntu-latest

    steps:
      - name: Expire stale claims
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.NORTHSTAROPS_PROJECT_TOKEN }}
          PROJECT_TITLE: NorthstarOps Pilot Test
          REPOSITORY: ${{ github.repository }}
          TIMEOUT_HOURS: ${{ inputs.timeout_hours || '24' }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "${TIMEOUT_HOURS}" =~ ^[0-9]+$ ]]; then
            echo "TIMEOUT_HOURS must be a non-negative integer."
            exit 1
          fi

          if [[ -z "${PROJECT_TOKEN}" ]]; then
            echo "NORTHSTAROPS_PROJECT_TOKEN is required for Project status synchronization."
            exit 1
          fi

          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY##*/}"
          now_epoch="$(date -u +%s)"
          timeout_seconds="$((TIMEOUT_HOURS * 3600))"

          project_json="$(GH_TOKEN="${PROJECT_TOKEN}" gh api graphql \
            -f query='query($org:String!) { organization(login:$org) { projectsV2(first:100) { nodes { id title fields(first:100) { nodes { ... on ProjectV2SingleSelectField { id name options { id name } } } } } } } }' \
            -F org="${owner}")"

          project_id="$(jq -r --arg title "${PROJECT_TITLE}" '.data.organization.projectsV2.nodes[] | select(.title == $title) | .id' <<<"${project_json}" | head -n1)"
          status_field_id="$(jq -r --arg title "${PROJECT_TITLE}" '.data.organization.projectsV2.nodes[] | select(.title == $title) | .fields.nodes[] | select(.name == "Status") | .id' <<<"${project_json}" | head -n1)"
          available_option_id="$(jq -r --arg title "${PROJECT_TITLE}" '.data.organization.projectsV2.nodes[] | select(.title == $title) | .fields.nodes[] | select(.name == "Status") | .options[]? | select(.name == "Available") | .id' <<<"${project_json}" | head -n1)"
          claimed_option_id="$(jq -r --arg title "${PROJECT_TITLE}" '.data.organization.projectsV2.nodes[] | select(.title == $title) | .fields.nodes[] | select(.name == "Status") | .options[]? | select(.name == "Claimed") | .id' <<<"${project_json}" | head -n1)"

          if [[ -z "${project_id}" || -z "${status_field_id}" || -z "${available_option_id}" || -z "${claimed_option_id}" ]]; then
            echo "Project Status configuration is incomplete for ${PROJECT_TITLE}."
            exit 1
          fi

          mapfile -t issue_numbers < <(
            gh api \
              --paginate \
              -X GET \
              search/issues \
              -f q="repo:${REPOSITORY} is:issue is:open label:\"status: claimed\"" \
              -f per_page=100 \
              --jq '.items[].number'
          )

          if [[ "${#issue_numbers[@]}" -eq 0 ]]; then
            echo "No claimed issues found."
            exit 0
          fi

          for issue_number in "${issue_numbers[@]}"; do
            echo "Checking Issue #${issue_number}"

            issue_json="$(gh api "repos/${REPOSITORY}/issues/${issue_number}")"
            claimant="$(jq -r '.assignees[0].login // empty' <<<"${issue_json}")"

            if [[ -z "${claimant}" ]]; then
              echo "Issue #${issue_number} has no assignee; skipping."
              continue
            fi

            claim_record="$(
              gh api \
                --paginate \
                -X GET \
                "repos/${REPOSITORY}/issues/${issue_number}/comments" \
                -f per_page=100 \
                --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- northstarops-claim -->"))) | [.created_at, .id] | @tsv' \
              | tail -n 1
            )"

            if [[ -z "${claim_record}" ]]; then
              echo "Issue #${issue_number} has no claim marker; treating as legacy claim and skipping."
              continue
            fi

            claim_created_at="${claim_record%%$'\t'*}"
            claim_epoch="$(date -u -d "${claim_created_at}" +%s)"
            deadline_epoch="$((claim_epoch + timeout_seconds))"

            if (( now_epoch < deadline_epoch )); then
              remaining_seconds="$((deadline_epoch - now_epoch))"
              echo "Issue #${issue_number} is still within timeout (${remaining_seconds}s remaining)."
              continue
            fi

            qualifying_pr=""

            while IFS= read -r pr_url; do
              pr_url="${pr_url//$'\r'/}"
              [[ -z "${pr_url}" ]] && continue

              pr_endpoint="${pr_url#https://api.github.com/}"
              pr_json="$(gh api -X GET "${pr_endpoint}")"
              pr_author="$(jq -r '.user.login // empty' <<<"${pr_json}")"
              pr_created_at="$(jq -r '.created_at // empty' <<<"${pr_json}")"
              pr_state="$(jq -r '.state // empty' <<<"${pr_json}")"
              pr_merged="$(jq -r '.merged // false' <<<"${pr_json}")"

              [[ "${pr_author}" != "${claimant}" ]] && continue
              [[ -z "${pr_created_at}" ]] && continue

              pr_epoch="$(date -u -d "${pr_created_at}" +%s)"

              if (( pr_epoch <= deadline_epoch )) && { [[ "${pr_state}" == "open" ]] || [[ "${pr_merged}" == "true" ]]; }; then
                qualifying_pr="${pr_url}"
                break
              fi
            done < <(
              gh api \
                --paginate \
                -X GET \
                -H "Accept: application/vnd.github+json" \
                "repos/${REPOSITORY}/issues/${issue_number}/timeline" \
                -f per_page=100 \
                --jq '.[] | select(.event == "cross-referenced" and .source.issue.pull_request != null) | .source.issue.pull_request.url' \
              | sort -u
            )

            if [[ -n "${qualifying_pr}" ]]; then
              echo "Issue #${issue_number} has a qualifying linked PR: ${qualifying_pr}"
              continue
            fi

            issue_project_json="$(GH_TOKEN="${PROJECT_TOKEN}" gh api graphql \
              -f query='query($owner:String!,$repo:String!,$number:Int!) { repository(owner:$owner,name:$repo) { issue(number:$number) { id projectItems(first:100) { nodes { id project { id } } } } } }' \
              -F owner="${owner}" \
              -F repo="${repo}" \
              -F number="${issue_number}")"

            issue_node_id="$(jq -r '.data.repository.issue.id' <<<"${issue_project_json}")"
            item_id="$(jq -r --arg project_id "${project_id}" '.data.repository.issue.projectItems.nodes[] | select(.project.id == $project_id) | .id' <<<"${issue_project_json}" | head -n1)"

            if [[ -z "${item_id}" ]]; then
              item_id="$(GH_TOKEN="${PROJECT_TOKEN}" gh api graphql \
                -f query='mutation($project:ID!,$content:ID!) { addProjectV2ItemById(input:{projectId:$project,contentId:$content}) { item { id } } }' \
                -F project="${project_id}" \
                -F content="${issue_node_id}" \
                --jq '.data.addProjectV2ItemById.item.id')"
            fi

            echo "Expiring claim on Issue #${issue_number} for @${claimant}"

            gh api \
              -X DELETE \
              "repos/${REPOSITORY}/issues/${issue_number}/assignees" \
              -f "assignees[]=${claimant}" \
              >/dev/null

            gh api \
              -X POST \
              "repos/${REPOSITORY}/issues/${issue_number}/labels" \
              -f "labels[]=status: available" \
              >/dev/null

            encoded_claimed="$(printf '%s' 'status: claimed' | jq -sRr @uri)"
            gh api \
              -X DELETE \
              "repos/${REPOSITORY}/issues/${issue_number}/labels/${encoded_claimed}" \
              >/dev/null

            if ! GH_TOKEN="${PROJECT_TOKEN}" gh api graphql \
              -f query='mutation($project:ID!,$item:ID!,$field:ID!,$option:String!) { updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{singleSelectOptionId:$option}}) { projectV2Item { id } } }' \
              -F project="${project_id}" \
              -F item="${item_id}" \
              -F field="${status_field_id}" \
              -F option="${available_option_id}" \
              >/dev/null; then
              gh api \
                -X POST \
                "repos/${REPOSITORY}/issues/${issue_number}/assignees" \
                -f "assignees[]=${claimant}" \
                >/dev/null || true

              gh api \
                -X POST \
                "repos/${REPOSITORY}/issues/${issue_number}/labels" \
                -f "labels[]=status: claimed" \
                >/dev/null || true

              encoded_available="$(printf '%s' 'status: available' | jq -sRr @uri)"
              gh api \
                -X DELETE \
                "repos/${REPOSITORY}/issues/${issue_number}/labels/${encoded_available}" \
                >/dev/null 2>&1 || true

              echo "Project Status could not be updated to Available; Issue claim rollback completed."
              exit 1
            fi

            gh api \
              -X POST \
              "repos/${REPOSITORY}/issues/${issue_number}/comments" \
              -f body="$(printf '%s\n%s' '<!-- northstarops-claim-timeout -->' "⏱️ @${claimant} için ${TIMEOUT_HOURS} saatlik claim süresi doldu ve bağlı bir Pull Request bulunamadı. Issue tekrar claim edilebilir duruma alındı.")" \
              >/dev/null
          done
