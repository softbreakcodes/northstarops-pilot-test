name: PR Review Status

on:
  pull_request_target:
    types: [ready_for_review, converted_to_draft]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-review-status-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync-status:
    runs-on: ubuntu-latest

    steps:
      - name: Sync linked Issue lifecycle status
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.NORTHSTAROPS_PROJECT_TOKEN }}
          PROJECT_TITLE: NorthstarOps Pilot Test
          REPOSITORY: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTION: ${{ github.event.action }}
        shell: bash
        run: |
          set -euo pipefail

          pr_body="$(jq -r '.pull_request.body // ""' "${GITHUB_EVENT_PATH}")"

          mapfile -t linked_issues < <(
            printf '%s\n' "${pr_body}" \
              | grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' \
              | grep -Eo '#[0-9]+' \
              | tr -d '#' \
              | sort -u \
              || true
          )

          if [[ "${#linked_issues[@]}" -ne 1 ]]; then
            echo "No unique linked Issue found; skipping status sync."
            exit 0
          fi

          issue_number="${linked_issues[0]}"
          issue_json="$(gh api "repos/${REPOSITORY}/issues/${issue_number}")"

          if [[ "$(jq -r '.state' <<<"${issue_json}")" != "open" ]]; then
            echo "Issue #${issue_number} is not open; skipping status sync."
            exit 0
          fi

          assignee="$(jq -r '.assignees[0].login // empty' <<<"${issue_json}")"
          if [[ -z "${assignee}" || "${assignee}" != "${PR_AUTHOR}" ]]; then
            echo "Issue #${issue_number} assignee does not match PR author; skipping status sync."
            exit 0
          fi

          if [[ -z "${PROJECT_TOKEN}" ]]; then
            echo "NORTHSTAROPS_PROJECT_TOKEN is not configured."
            exit 1
          fi

          ensure_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            local encoded
            encoded="$(printf '%s' "${name}" | jq -sRr @uri)"

            if ! gh api "repos/${REPOSITORY}/labels/${encoded}" >/dev/null 2>&1; then
              gh api \
                -X POST \
                "repos/${REPOSITORY}/labels" \
                -f name="${name}" \
                -f color="${color}" \
                -f description="${description}" \
                >/dev/null
            fi
          }

          remove_label_if_present() {
            local name="$1"
            local encoded
            encoded="$(printf '%s' "${name}" | jq -sRr @uri)"
            gh api \
              -X DELETE \
              "repos/${REPOSITORY}/issues/${issue_number}/labels/${encoded}" \
              >/dev/null 2>&1 || true
          }

          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY##*/}"

          project_json="$(GH_TOKEN="${PROJECT_TOKEN}" gh api graphql \
            -f query='query($org:String!) { organization(login:$org) { projectsV2(first:100) { nodes { id title fields(first:100) { nodes { ... on ProjectV2SingleSelectField { id name options { id name } } } } } } } }' \
            -F org="${owner}")"

          project_id="$(jq -r --arg title "${PROJECT_TITLE}" '.data.organization.projectsV2.nodes[] | select(.title == $title) | .id' <<<"${project_json}" | head -n1)"
          status_field_id="$(jq -r --arg title "${PROJECT_TITLE}" '.data.organization.projectsV2.nodes[] | select(.title == $title) | .fields.nodes[] | select(.name == "Status") | .id' <<<"${project_json}" | head -n1)"

          case "${ACTION}" in
            ready_for_review)
              target_project_status="In Review"
              ;;
            converted_to_draft)
              target_project_status="Claimed"
              ;;
            *)
              echo "Unsupported action: ${ACTION}"
              exit 0
              ;;
          esac

          target_option_id="$(jq -r --arg title "${PROJECT_TITLE}" --arg option "${target_project_status}" '.data.organization.projectsV2.nodes[] | select(.title == $title) | .fields.nodes[] | select(.name == "Status") | .options[]? | select(.name == $option) | .id' <<<"${project_json}" | head -n1)"

          if [[ -z "${project_id}" || -z "${status_field_id}" || -z "${target_option_id}" ]]; then
            echo "Project Status configuration not found: ${PROJECT_TITLE} -> ${target_project_status}"
            exit 1
          fi

          issue_project_json="$(GH_TOKEN="${PROJECT_TOKEN}" gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!) { repository(owner:$owner,name:$repo) { issue(number:$number) { id projectItems(first:100) { nodes { id project { id } } } } } }' \
            -F owner="${owner}" \
            -F repo="${repo}" \
            -F number="${issue_number}")"

          issue_node_id="$(jq -r '.data.repository.issue.id' <<<"${issue_project_json}")"
          item_id="$(jq -r --arg project_id "${project_id}" '.data.repository.issue.projectItems.nodes[] | select(.project.id == $project_id) | .id' <<<"${issue_project_json}" | head -n1)"

          if [[ -z "${item_id}" ]]; then
            item_id="$(GH_TOKEN="${PROJECT_TOKEN}" gh api graphql \
              -f query='mutation($project:ID!,$content:ID!) { addProjectV2ItemById(input:{projectId:$project,contentId:$content}) { item { id } } }' \
              -F project="${project_id}" \
              -F content="${issue_node_id}" \
              --jq '.data.addProjectV2ItemById.item.id')"
          fi

          GH_TOKEN="${PROJECT_TOKEN}" gh api graphql \
            -f query='mutation($project:ID!,$item:ID!,$field:ID!,$option:String!) { updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{singleSelectOptionId:$option}}) { projectV2Item { id } } }' \
            -F project="${project_id}" \
            -F item="${item_id}" \
            -F field="${status_field_id}" \
            -F option="${target_option_id}" \
            >/dev/null

          if [[ "${ACTION}" == "ready_for_review" ]]; then
            ensure_label "status: in-review" "FBCA04" "Pull request review için hazır"

            gh api \
              -X POST \
              "repos/${REPOSITORY}/issues/${issue_number}/labels" \
              -f "labels[]=status: in-review" \
              >/dev/null

            remove_label_if_present "status: claimed"
            echo "Issue #${issue_number}: Claimed -> In Review (label + Project)"
            exit 0
          fi

          ensure_label "status: claimed" "0969DA" "Bir katılımcı tarafından sahiplenilmiş Issue"

          gh api \
            -X POST \
            "repos/${REPOSITORY}/issues/${issue_number}/labels" \
            -f "labels[]=status: claimed" \
            >/dev/null

          remove_label_if_present "status: in-review"
          echo "Issue #${issue_number}: In Review -> Claimed (label + Project)"
